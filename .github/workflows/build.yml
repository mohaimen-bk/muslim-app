name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'
          java-version: '17'

      - name: Prepare Web App Files
        run: |
          mkdir -p www
          cp *.html www/index.html || true
          cp *.mp3 www/ || true

      - name: Build with Cordova / Bubblewrap or WebAPK generator
        run: |
          echo "Building APK package..."
          # سنستخدم أداة بسيطة لتوليد الحزمة
          npm install -g cordova
          cordova create myApp com.muslim.app MuslimApp
          cd myApp
          cp -r ../www/* www/
          cordova platform add android
          cordova build android --release
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: myApp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
