name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Prepare Web App Files
        run: |
          mkdir -p www
          # نسخ أي ملف HTML أيا كانت تسميته
          cp *.html www/index.html || true
          # نسخ ملفات الصوت بصيغة mp3
          cp *.mp3 www/ || true
          echo "Files prepared successfully!"
