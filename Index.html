<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f2a24">
<title>رفيق المسلم</title>
<style>
:root{--bg:#0f2a24;--card:#17392f;--gold:#e8c56a;--tx:#f3efe0;--mut:#9fb8ae}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Naskh Arabic",Amiri,Tahoma,sans-serif;padding-bottom:78px}
.page{display:none;padding:16px}
.page.on{display:block}
h2{margin:0 0 4px;text-align:center;color:var(--gold)}
.sub{text-align:center;color:var(--mut);font-size:15px;margin-bottom:12px}
.hero{background:var(--card);border-radius:18px;padding:18px;text-align:center;margin:12px 0;border:1px solid rgba(232,197,106,.3)}
.hero small{color:var(--mut)}
#nextName{font-size:30px;color:var(--gold);margin:4px 0}
#cd{font-size:38px;font-family:monospace;letter-spacing:2px}
.row{display:flex;justify-content:space-between;background:var(--card);padding:13px 16px;border-radius:12px;margin-bottom:8px;font-size:19px}
.row.next{background:var(--gold);color:#1b2b24;font-weight:bold}
.btns{display:flex;gap:8px;margin-top:10px}
.btns button{flex:1;padding:12px;border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:16px;border:1px solid rgba(232,197,106,.3)}
#note{text-align:center;color:#ffb74d;font-size:14px;margin-top:10px;min-height:18px}
.soon{text-align:center;color:var(--mut);margin-top:60px;font-size:20px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0a1d19;border-top:1px solid rgba(255,255,255,.1)}
nav button{flex:1;padding:8px 0;background:none;border:0;color:var(--mut);font:inherit;font-size:12px}
nav button span{display:block;font-size:21px}
nav button.on{color:var(--gold)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.tabs button{flex:none;padding:9px 14px;border-radius:20px;border:1px solid rgba(232,197,106,.3);background:var(--card);color:var(--tx);font:inherit;font-size:15px}
.tabs button.on{background:var(--gold);color:#1b2b24}
.dh{background:var(--card);border-radius:14px;padding:16px;margin-bottom:10px;font-size:21px;line-height:2;text-align:center}
.dh p{margin:0}
.dh .cnt{margin-top:6px;color:var(--gold);font-size:18px;font-family:sans-serif}
.dh.done{opacity:.45}
.src{display:block;color:var(--mut);font-size:14px;font-family:sans-serif}
.cp{margin-top:6px;padding:6px 14px;border-radius:10px;border:1px solid rgba(232,197,106,.3);background:none;color:var(--gold);font:inherit;font-size:14px}
.seb{text-align:center;margin-top:20px}
#sc{font-size:80px;color:var(--gold);font-family:monospace}
#sb{width:200px;height:200px;border-radius:50%;border:4px solid var(--gold);background:var(--card);color:var(--tx);font:inherit;font-size:28px;margin:14px 0}
#sb:active{transform:scale(.95)}
.rst{display:block;margin:6px auto 0;padding:10px 20px;border-radius:12px;border:1px solid rgba(232,197,106,.3);background:none;color:var(--mut);font:inherit}
/* الشريط العلوي */
#alarm,#remBar{position:fixed;top:0;left:0;right:0;z-index:9;background:var(--gold);color:#1b2b24;padding:12px;text-align:center;font-size:19px;display:none}
#remBar{background:#9ad9b0}
#alarm button,#remBar button{margin:4px 6px 0;padding:6px 14px;border-radius:10px;border:0;background:#1b2b24;color:var(--gold);font:inherit}
/* المصحف */
.srch{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(232,197,106,.3);background:var(--card);color:var(--tx);font:inherit;font-size:16px;margin:10px 0}
.sw{display:flex;align-items:center;gap:12px;background:var(--card);padding:12px 14px;border-radius:12px;margin-bottom:8px}
.sw .n{width:36px;height:36px;line-height:34px;text-align:center;border:1px solid var(--gold);border-radius:50%;color:var(--gold);font-size:14px;flex:none;font-family:sans-serif}
.sw .m{flex:1;font-size:20px}
.sw small{display:block;color:var(--mut);font-size:13px}
#qbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
#qbar button{padding:8px 14px;border-radius:10px;border:1px solid rgba(232,197,106,.3);background:var(--card);color:var(--tx);font:inherit}
#qbar b{flex:1;text-align:center;color:var(--gold);font-size:20px}
#qtext{background:var(--card);border-radius:16px;padding:18px;line-height:2.4;text-align:justify;font-family:"Amiri Quran",Amiri,"Noto Naskh Arabic",serif;font-size:26px}
.bsm{text-align:center;color:var(--gold);margin-bottom:10px}
.ay.bk{background:rgba(232,197,106,.25);border-radius:6px}
.ay i{font-style:normal;color:var(--gold);font-size:.7em;margin:0 4px}
/* القبلة */
#compass{position:relative;width:280px;height:280px;margin:26px auto}
#dial{position:absolute;inset:0;border-radius:50%;border:4px solid var(--gold);background:var(--card);transition:transform .15s linear,border-color .2s}
#dial.ok{border-color:#4caf50}
.ray{position:absolute;inset:0}
.ray span{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:36px}
.ray b{position:absolute;top:8px;left:50%;transform:translateX(-50%);color:#ff6b6b;font-family:sans-serif}
#pin{position:absolute;top:-16px;left:50%;transform:translateX(-50%);border:11px solid transparent;border-top-color:var(--gold);z-index:2}
#qbNote{text-align:center;color:var(--mut);font-size:14px;margin-top:12px;line-height:1.8}
</style>
</head>
<body>

<div id="alarm">
  <span id="alText"></span><br>
  <button id="alPlay" style="display:none">▶ تشغيل</button>
  <button id="alStop">⏹ إيقاف</button>
</div>
<div id="remBar">
  <span id="remText"></span><br>
  <button id="remOpen">افتحها</button>
  <button id="remX">إغلاق</button>
</div>

<div class="page on" id="prayer">
  <h2>🕌 مواعيد الصلاة</h2>
  <div class="sub"><span id="hijri"></span> · <span id="city"></span></div>
  <div class="hero">
    <small>الصلاة القادمة</small>
    <div id="nextName">--</div>
    <div id="cd">--:--:--</div>
  </div>
  <div id="list"></div>
  <div class="btns">
    <button id="gps">📍 موقعي</button>
    <button id="chg">🏙 تغيير المدينة</button>
  </div>
  <div class="btns">
    <button id="adh"></button>
    <button id="adt">▶ تجربة الأذان</button>
  </div>
  <div class="btns">
    <button id="rmb"></button>
  </div>
  <div class="btns" id="ntRow" style="display:none">
    <button id="nt">🔔 تجربة إشعار الأذان (بعد 5 ثوانٍ)</button>
  </div>
  <div id="note"></div>
</div>

<div class="page" id="adhkar">
  <h2>📿 الأذكار</h2>
  <div class="tabs" id="atabs"></div>
  <div id="alist"></div>
</div>

<div class="page" id="duas">
  <h2>🤲 الأدعية</h2>
  <div class="tabs" id="dtabs"></div>
  <div id="dlist"></div>
</div>

<div class="page" id="quran">
  <div id="qlist">
    <h2>📖 المصحف</h2>
    <div id="qcont"></div>
    <input class="srch" id="qs" placeholder="🔍 ابحث عن سورة (اسم أو رقم)">
    <div id="qrows"></div>
  </div>
  <div id="qread" style="display:none">
    <div id="qbar">
      <button id="qback">☰ السور</button>
      <b id="qtitle"></b>
      <button id="qm">A−</button>
      <button id="qp">A+</button>
    </div>
    <div id="qtext"></div>
    <div class="btns">
      <button id="qprev">السورة السابقة</button>
      <button id="qnext">السورة التالية</button>
    </div>
  </div>
</div>

<div class="page" id="qibla">
  <h2>🧭 اتجاه القبلة</h2>
  <div class="sub" id="qbInfo">--</div>
  <div id="compass">
    <div id="pin"></div>
    <div id="dial">
      <div class="ray"><b>N</b></div>
      <div class="ray" id="rayK"><span>🕋</span></div>
    </div>
  </div>
  <div class="sub" id="qbState"></div>
  <div class="btns"><button id="qbStart">▶ تشغيل البوصلة</button></div>
  <div id="qbNote">ضع الهاتف أفقيًا ومسطحًا وبعيدًا عن المعادن والمغناطيس، ثم حرّكه حتى يصل 🕋 إلى السهم في الأعلى.</div>
</div>

<nav>
  <button class="on" data-p="prayer"><span>🕌</span>الصلاة</button>
  <button data-p="adhkar"><span>📿</span>الأذكار</button>
  <button data-p="duas"><span>🤲</span>الأدعية</button>
  <button data-p="quran"><span>📖</span>المصحف</button>
  <button data-p="qibla"><span>🧭</span>القبلة</button>
</nav>

<script>
const $ = s => document.querySelector(s);
const save = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } };

// ===== هل نعمل داخل تطبيق أندرويد؟ =====
const NATIVE = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const LN = (NATIVE && Capacitor.Plugins) ? Capacitor.Plugins.LocalNotifications : null;
let notifOK = false;
if (LN) $('#ntRow').style.display = 'flex';

// ===== التبويبات =====
function showPage(p) {
  document.querySelectorAll('.page').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.p === p));
  $('#' + p).classList.add('on');
  if (p === 'quran' && !surahs) loadSurahs();
  if (p === 'qibla') updQibla();
  window.scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => showPage(b.dataset.p));

// ===== الأذان =====
const adhan = new Audio('adhan.mp3');
let adhanOn = !!load('adhanOn'), remOn = !!load('remOn');
let fired = load('fired') || {};
const todayStr = new Date().toDateString();
fired = Object.fromEntries(Object.entries(fired).filter(([k]) => k.includes(todayStr)));

function updBtns() {
  $('#adh').textContent = adhanOn ? '🔔 الأذان: مفعّل' : '🔕 الأذان: متوقف';
  $('#rmb').textContent = remOn ? '⏰ تذكير الأذكار: مفعّل' : '⏰ تذكير الأذكار: متوقف';
}
updBtns();

function unlockAudio() {
  if (!adhan.paused) return;
  adhan.volume = 0;
  adhan.play().then(() => { adhan.pause(); adhan.currentTime = 0; adhan.volume = 1; })
    .catch(() => { adhan.volume = 1; });
}
$('#adh').onclick = () => {
  adhanOn = !adhanOn; save('adhanOn', adhanOn); updBtns();
  if (adhanOn) unlockAudio();
  schedNotifs();
};
$('#rmb').onclick = () => { remOn = !remOn; save('remOn', remOn); updBtns(); schedNotifs(); };
document.addEventListener('pointerdown', () => { if (adhanOn) unlockAudio(); }, {once:true});

function ring(text) {
  $('#alText').textContent = text;
  $('#alPlay').style.display = 'none';
  $('#alarm').style.display = 'block';
  adhan.currentTime = 0;
  adhan.play().catch(e => {
    if (e.name === 'NotAllowedError') {
      $('#alText').textContent += ' — المس "تشغيل" لسماع الأذان';
      $('#alPlay').style.display = 'inline-block';
    } else {
      $('#alText').textContent += ' (ملف adhan.mp3 غير موجود بجانب index.html)';
    }
  });
}
$('#alStop').onclick = () => { adhan.pause(); adhan.currentTime = 0; $('#alarm').style.display = 'none'; };
$('#alPlay').onclick = () => { adhan.play(); $('#alPlay').style.display = 'none'; };
adhan.onended = () => { $('#alarm').style.display = 'none'; };
$('#adt').onclick = () => ring('تجربة الأذان');

// ===== تذكير الأذكار (داخل الصفحة) =====
let remCat = 'morning';
function remind(name, c) {
  remCat = c;
  $('#remText').textContent = '🔔 حان وقت ' + name;
  $('#remBar').style.display = 'block';
  navigator.vibrate && navigator.vibrate([200, 100, 200]);
}
$('#remOpen').onclick = () => { cat = remCat; renderA(); showPage('adhkar'); $('#remBar').style.display = 'none'; };
$('#remX').onclick = () => { $('#remBar').style.display = 'none'; };

// ===== مواعيد الصلاة =====
const NAMES = {Fajr:'الفجر',Sunrise:'الشروق',Dhuhr:'الظهر',Asr:'العصر',Maghrib:'المغرب',Isha:'العشاء'};
const ORDER = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];
let loc = load('loc') || {q:'city=Setif&country=Algeria', label:'سطيف'};
let times = null, hijri = '', coords = null;

function toDate(t) {
  const [h, m] = t.slice(0,5).split(':');
  const d = new Date(); d.setHours(+h, +m, 0, 0); return d;
}

function render() {
  $('#city').textContent = '📍 ' + loc.label;
  $('#hijri').textContent = hijri;
  $('#list').innerHTML = ['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha']
    .map(k => `<div class="row" data-k="${k}"><span>${NAMES[k]}</span><b>${times[k].slice(0,5)}</b></div>`).join('');
  tick();
  schedNotifs();
}

function tick() {
  if (!times) return;
  const now = new Date(), ds = now.toDateString();
  // إن كانت الإشعارات مجدولة فهي التي تتولى الأذان والتذكير
  if (adhanOn && !notifOK) {
    for (const k of ORDER) {
      const diff = now - toDate(times[k]), fk = k + ds;
      if (diff >= 0 && diff < 60000 && !fired[fk]) {
        fired[fk] = 1; save('fired', fired);
        ring('حان الآن موعد أذان ' + NAMES[k]);
      }
    }
  }
  if (remOn && !notifOK) {
    const slots = [
      ['morning', 'أذكار الصباح', new Date(toDate(times.Fajr).getTime() + 30*60000)],
      ['evening', 'أذكار المساء', new Date(toDate(times.Asr).getTime() + 20*60000)]
    ];
    for (const [c, n, d] of slots) {
      const diff = now - d, fk = 'r' + c + ds;
      if (diff >= 0 && diff < 60000 && !fired[fk]) {
        fired[fk] = 1; save('fired', fired);
        remind(n, c);
      }
    }
  }
  let next = null;
  for (const k of ORDER) {
    const d = toDate(times[k]);
    if (d > now) { next = {k, d}; break; }
  }
  if (!next) { const d = toDate(times.Fajr); d.setDate(d.getDate() + 1); next = {k:'Fajr', d}; }
  const s = Math.floor((next.d - now) / 1000);
  $('#nextName').textContent = NAMES[next.k];
  $('#cd').textContent = [Math.floor(s/3600), Math.floor(s/60) % 60, s % 60]
    .map(x => String(x).padStart(2,'0')).join(':');
  document.querySelectorAll('.row').forEach(r => r.classList.toggle('next', r.dataset.k === next.k));
}
setInterval(tick, 1000);

async function refresh() {
  const t = new Date(), key = t.toDateString(), c = load('cache');
  $('#note').textContent = '';
  if (c && c.key === key && c.q === loc.q && c.lat) {
    times = c.times; hijri = c.hijri; coords = {lat:c.lat, lon:c.lon}; render(); return;
  }
  try {
    const dd = `${String(t.getDate()).padStart(2,'0')}-${String(t.getMonth()+1).padStart(2,'0')}-${t.getFullYear()}`;
    const path = loc.q.startsWith('city') ? 'timingsByCity' : 'timings';
    const r = await fetch(`https://api.aladhan.com/v1/${path}/${dd}?${loc.q}&method=19`);
    const j = await r.json();
    times = j.data.timings;
    const h = j.data.date.hijri;
    hijri = `${h.day} ${h.month.ar} ${h.year} هـ`;
    coords = {lat:+j.data.meta.latitude, lon:+j.data.meta.longitude};
    save('cache', {key, q: loc.q, times, hijri, lat:coords.lat, lon:coords.lon});
    render();
  } catch (e) {
    if (c && c.q === loc.q) {
      times = c.times; hijri = c.hijri;
      if (c.lat) coords = {lat:c.lat, lon:c.lon};
      render();
      $('#note').textContent = '⚠ لا يوجد اتصال، هذه مواعيد محفوظة قد لا تكون لليوم';
    } else {
      $('#note').textContent = '⚠ تعذر جلب المواعيد، تأكد من الإنترنت';
    }
  }
}

$('#gps').onclick = () => {
  $('#note').textContent = 'جاري تحديد موقعك...';
  navigator.geolocation.getCurrentPosition(p => {
    loc = {q:`latitude=${p.coords.latitude}&longitude=${p.coords.longitude}`, label:'موقعي الحالي'};
    save('loc', loc); refresh();
  }, () => { $('#note').textContent = '⚠ تعذر تحديد الموقع، اسمح بإذن الموقع أو اختر مدينة'; });
};

$('#chg').onclick = () => {
  const city = prompt('اسم المدينة (بالإنجليزية، مثل: Setif)');
  if (!city) return;
  const country = prompt('اسم الدولة (بالإنجليزية، مثل: Algeria)', 'Algeria');
  if (!country) return;
  loc = {q:`city=${encodeURIComponent(city)}&country=${encodeURIComponent(country)}`, label: city};
  save('loc', loc); refresh();
};

// ===== إشعارات أندرويد (الأذان والتذكير حتى والتطبيق مغلق) =====
async function ensureChannels() {
  await LN.createChannel({id:'adhan_v1', name:'الأذان', description:'تنبيه أوقات الصلاة', importance:5, sound:'adhan.mp3', vibration:true, visibility:1});
  await LN.createChannel({id:'dhikr_v1', name:'تذكير الأذكار', description:'أذكار الصباح والمساء', importance:4, vibration:true, visibility:1});
}
async function clearPending() {
  const p = await LN.getPending();
  if (p.notifications && p.notifications.length) await LN.cancel({notifications: p.notifications.map(n => ({id: n.id}))});
}
async function fetchMonth(y, m) {
  const path = loc.q.startsWith('city') ? 'calendarByCity' : 'calendar';
  const r = await fetch(`https://api.aladhan.com/v1/${path}/${y}/${m}?${loc.q}&method=19`);
  return (await r.json()).data;
}
async function schedNotifs() {
  if (!LN) return;
  const key = [todayStr, loc.q, adhanOn, remOn].join('|');
  if (load('schedKey') === key) { notifOK = adhanOn || remOn; return; }
  try {
    if (!adhanOn && !remOn) { await clearPending(); save('schedKey', key); notifOK = false; return; }
    const perm = await LN.requestPermissions();
    if (perm.display !== 'granted') {
      $('#note').textContent = '⚠ اسمح للتطبيق بإرسال الإشعارات من إعدادات الهاتف';
      notifOK = false; return;
    }
    const now = new Date();
    const nx = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    const data = [...await fetchMonth(now.getFullYear(), now.getMonth() + 1), ...await fetchMonth(nx.getFullYear(), nx.getMonth() + 1)];
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const lim = new Date(start.getTime() + 7 * 86400000);
    const list = []; let id = 1;
    for (const e of data) {
      const [dd, mm, yy] = e.date.gregorian.date.split('-').map(Number);
      const day0 = new Date(yy, mm - 1, dd);
      if (day0 < start || day0 >= lim) continue;
      const at = k => { const [h, m] = e.timings[k].slice(0, 5).split(':'); return new Date(yy, mm - 1, dd, +h, +m, 0); };
      if (adhanOn) {
        for (const k of ORDER) {
          const d = at(k);
          if (d > now) list.push({id: id++, title: 'حان وقت صلاة ' + NAMES[k], body: k === 'Fajr' ? 'الصَّلَاةُ خَيْرٌ مِنَ النَّوْمِ' : 'حَيَّ عَلَى الصَّلَاةِ', schedule: {at: d, allowWhileIdle: true}, channelId: 'adhan_v1', sound: 'adhan.mp3'});
        }
      }
      if (remOn) {
        const m1 = new Date(at('Fajr').getTime() + 30 * 60000), m2 = new Date(at('Asr').getTime() + 20 * 60000);
        if (m1 > now) list.push({id: id++, title: 'أذكار الصباح', body: 'حان وقت أذكار الصباح 📿', schedule: {at: m1, allowWhileIdle: true}, channelId: 'dhikr_v1'});
        if (m2 > now) list.push({id: id++, title: 'أذكار المساء', body: 'حان وقت أذكار المساء 📿', schedule: {at: m2, allowWhileIdle: true}, channelId: 'dhikr_v1'});
      }
    }
    await ensureChannels();
    await clearPending();
    if (list.length) await LN.schedule({notifications: list});
    save('schedKey', key);
    notifOK = true;
  } catch (e) {
    notifOK = false;
    if (!$('#note').textContent) $('#note').textContent = '⚠ تعذر جدولة الإشعارات، تأكد من الإنترنت وأعد فتح التطبيق';
  }
}
$('#nt').onclick = async () => {
  try {
    const p = await LN.requestPermissions();

  document.querySelectorAll('#dtabs button').forEach(b=>b.onclick=()=>{dcat=b.dataset.c;renderD();});
  $('#dlist').innerHTML=D[dcat].items.map((it,i)=>
    `<div class="dh"><p>${it[0]}</p><small class="src">${it[1]}</small><button class="cp" data-i="${i}">📋 نسخ</button></div>`).join('');
}
$('#dlist').onclick=e=>{
  const b=e.target.closest('.cp'); if(!b) return;
  const t=D[dcat].items[+b.dataset.i][0];
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject())
    .then(()=>{b.textContent='✓ تم النسخ';}).catch(()=>{b.textContent='تعذر النسخ';});
  setTimeout(()=>{b.textContent='📋 نسخ';},1500);
};
renderD();

// ===== القبلة =====
const KA={lat:21.4225,lon:39.8262};
let QD=null, curRot=0, compassOn=false;
function calcQibla(){
  const r=Math.PI/180,p1=coords.lat*r,p2=KA.lat*r,dl=(KA.lon-coords.lon)*r;
  const y=Math.sin(dl)*Math.cos(p2);
  const x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  QD=(Math.atan2(y,x)/r+360)%360;
}
function updQibla(){
  if(!coords){ $('#qbInfo').textContent='⚠ لم يتم تحديد إحداثيات موقعك بعد (يلزم إنترنت مرة واحدة)'; return; }
  calcQibla();
  $('#qbInfo').textContent=`القبلة ${Math.round(QD)}° من الشمال (باتجاه عقارب الساعة)`;
  $('#rayK').style.transform=`rotate(${QD}deg)`;
}
function setHeading(h){
  const d=(((-h-curRot)%360)+540)%360-180;
  curRot+=d;
  $('#dial').style.transform=`rotate(${curRot}deg)`;
  const diff=(((QD-h)%360)+540)%360-180, ok=Math.abs(diff)<5;
  $('#dial').classList.toggle('ok',ok);
  $('#qbState').textContent=ok?'✓ أنت متجه نحو القبلة':'';
}
$('#qbStart').onclick=async()=>{
  if(!coords){ updQibla(); return; }
  if(compassOn) return;
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=='granted'){ $('#qbState').textContent='⚠ لم يُسمح باستخدام المستشعر'; return; }
    }
  }catch(e){}
  const handler=e=>{
    let hd;
    if(e.webkitCompassHeading!=null) hd=e.webkitCompassHeading;
    else if(e.alpha!=null) hd=(360-e.alpha)%360;
    else return;
    setHeading(hd);
  };
  if('ondeviceorientationabsolute' in window) addEventListener('deviceorientationabsolute',handler,true);
  else addEventListener('deviceorientation',handler,true);
  compassOn=true;
  $('#qbStart').textContent='✓ البوصلة تعمل';
  $('#qbState').textContent='حرّك الهاتف قليلًا لمعايرة البوصلة (حركة رقم 8)';
};

// ===== المصحف =====
let surahs = load('surahs'), qpos = load('qpos') || {s:0,a:0}, cur = 0, qf = load('qf') || 26;
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const norm = s => s.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'').replace(/[ٱأإآ]/g,'ا');
const BS = 'بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ';

async function loadSurahs() {
  if (!surahs) {
    try {
      const r = await fetch('https://api.alquran.cloud/v1/surah');
      surahs = (await r.json()).data.map(s => ({n:s.number, name:s.name, a:s.numberOfAyahs, t:s.revelationType}));
      save('surahs', surahs);
    } catch (e) {
      $('#qrows').innerHTML = '<div class="soon" style="font-size:16px;margin-top:20px">⚠ تعذر تحميل قائمة السور، تأكد من الإنترنت ثم افتح التبويب مجددًا</div>';
      return;
    }
  }
  drawSurahs();
}

function drawSurahs() {
  const q = norm($('#qs').value.trim());
  const list = surahs.filter(s => !q || norm(s.name).includes(q) || String(s.n) === q);
  $('#qrows').innerHTML = list.map(s =>
    `<div class="sw" data-n="${s.n}"><div class="n">${s.n}</div><div class="m">${s.name}<small>${s.a} آية · ${s.t==='Meccan'?'مكية':'مدنية'}</small></div></div>`).join('');
  $('#qcont').innerHTML = qpos.s
    ? `<button class="rst" id="qc" style="margin-bottom:6px;color:var(--gold)">▶ متابعة القراءة: ${surahs[qpos.s-1].name}، آية ${qpos.a||1}</button>` : '';
  if (qpos.s) $('#qc').onclick = () => openSurah(qpos.s, qpos.a);
}

async function openSurah(n, a) {
  cur = n;
  if (!a) a = (qpos.s === n ? qpos.a : 1) || 1;
  qpos = {s:n, a:a}; save('qpos', qpos);
  $('#qlist').style.display = 'none'; $('#qread').style.display = 'block';
  $('#qtitle').textContent = surahs[n-1].name;
  $('#qtext').style.fontSize = qf + 'px';
  $('#qtext').innerHTML = '<div class="soon" style="margin:30px 0;font-size:16px">جاري التحميل...</div>';
  let d = load('s' + n);
  if (!d) {
    try {
      const r = await fetch(`https://api.alquran.cloud/v1/surah/${n}/quran-uthmani`);
      d = (await r.json()).data.ayahs.map(x => x.text);
      save('s' + n, d);
    } catch (e) {
      $('#qtext').innerHTML = '<div class="soon" style="margin:30px 0;font-size:16px">⚠ تعذر تحميل السورة، تأكد من الإنترنت</div>';
      return;
    }
  }
  const t = d.slice();
  const hasBism = n !== 1 && n !== 9;
  if (hasBism && norm(t[0]).startsWith('بسم الله الرحمن الرحيم')) t[0] = t[0].split(' ').slice(4).join(' ');
  $('#qtext').innerHTML = (hasBism ? `<div class="bsm" style="font-size:1.1em">${BS}</div>` : '') +
    t.map((x, i) => `<span class="ay${a > 1 && i + 1 === a ? ' bk' : ''}" data-a="${i+1}">${x} <i>﴿${AR(i+1)}﴾</i></span>`).join(' ');
  const el = $('.ay[data-a="' + a + '"]');
  if (a > 1 && el) el.scrollIntoView({block:'center'}); else window.scrollTo(0, 0);
}

$('#qrows').onclick = e => { const r = e.target.closest('.sw'); if (r) openSurah(+r.dataset.n); };
$('#qs').oninput = () => { if (surahs) drawSurahs(); };
$('#qtext').onclick = e => {
  const s = e.target.closest('.ay'); if (!s) return;
  document.querySelectorAll('.ay.bk').forEach(x => x.classList.remove('bk'));
  s.classList.add('bk');
  qpos = {s:cur, a:+s.dataset.a}; save('qpos', qpos);
};
$('#qback').onclick = () => { $('#qread').style.display = 'none'; $('#qlist').style.display = 'block'; drawSurahs(); };
$('#qprev').onclick = () => { if (cur > 1) openSurah(cur - 1, 1); };
$('#qnext').onclick = () => { if (cur < 114) openSurah(cur + 1, 1); };
$('#qm').onclick = () => { qf = Math.max(18, qf - 2); save('qf', qf); $('#qtext').style.fontSize = qf + 'px'; };
$('#qp').onclick = () => { qf = Math.min(44, qf + 2); save('qf', qf); $('#qtext').style.fontSize = qf + 'px'; };

// ===== التشغيل =====
loadSurahs();
refresh();
</script>
</body>
</html>
